name: yaze_ios
options:
  bundleIdPrefix: org.halext
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: yaze
    # Override these at build time by passing KEY=VALUE to xcodebuild (see scripts/xcodebuild-ios.sh).
    YAZE_IOS_BUNDLE_ID: org.halext.yaze-ios
    PRODUCT_BUNDLE_IDENTIFIER: "$(YAZE_IOS_BUNDLE_ID)"
    YAZE_IOS_TEAM_ID: SN8Z922TT6
    DEVELOPMENT_TEAM: "$(YAZE_IOS_TEAM_ID)"
    YAZE_ICLOUD_CONTAINER_ID: iCloud.org.halext.yaze
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: iOS/Info-iOS.plist
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    GCC_C_LANGUAGE_STANDARD: c17
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    YAZE_IOS_CMAKE_DIR: "$(SRCROOT)/../../build/presets/ios-debug"
    YAZE_IOS_CMAKE_DIR[config=Release]: "$(SRCROOT)/../../build/presets/ios-release"
    YAZE_IOS_CMAKE_DIR[sdk=iphonesimulator*]: "$(SRCROOT)/../../build/presets/ios-sim-debug"
    YAZE_SDL_CONFIG_DIR: "$(YAZE_IOS_CMAKE_DIR)/_deps/sdl2-build/include-config-debug/SDL2"
    YAZE_SDL_CONFIG_DIR[config=Release]: "$(YAZE_IOS_CMAKE_DIR)/_deps/sdl2-build/include-config-release/SDL2"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../src"
      - "$(SRCROOT)/../../inc"
      - "$(SRCROOT)/../../ext"
      - "$(SRCROOT)/../../ext/imgui"
      - "$(YAZE_IOS_CMAKE_DIR)"
      - "$(YAZE_IOS_CMAKE_DIR)/gens"
      - "$(YAZE_IOS_CMAKE_DIR)/_deps/absl-src"
      - "$(YAZE_IOS_CMAKE_DIR)/_deps/nlohmann_json-src/include"
    SYSTEM_HEADER_SEARCH_PATHS:
      - "$(YAZE_IOS_CMAKE_DIR)/_deps/SDL2-src/include"
      - "$(YAZE_IOS_CMAKE_DIR)/_deps/sdl2-src/include"
      - "$(YAZE_IOS_CMAKE_DIR)/_deps/sdl2-build/include"
      - "$(YAZE_IOS_CMAKE_DIR)/_deps/sdl2-build/include/SDL2"
      - "$(YAZE_SDL_CONFIG_DIR)"
      - "$(SRCROOT)/../../ext/SDL/include"
      - "$(SRCROOT)/../../inc"
    YAZE_IOS_LIBDIR: "$(YAZE_IOS_CMAKE_DIR)/ios"
    YAZE_IOS_BUNDLE_LIB: "$(YAZE_IOS_LIBDIR)/libyaze_ios_bundle.a"
    LIBRARY_SEARCH_PATHS:
      - "$(YAZE_IOS_LIBDIR)"
    OTHER_LDFLAGS:
      - "-ObjC"
      - "-force_load"
      - "$(YAZE_IOS_BUNDLE_LIB)"
    SWIFT_VERSION: "5.9"
    SWIFT_OBJC_BRIDGING_HEADER: iOS/Yaze-Bridging-Header.h
    SWIFT_OBJC_INTERFACE_HEADER_NAME: yaze-Swift.h
    DEFINES_MODULE: YES
targets:
  yaze_ios:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: main.mm
      - path: iOS/YazeIOSBridge.mm
      - path: iOS/YazeOverlayView.swift
      - path: iOS/YazeSettingsStore.swift
      - path: iOS/RemoteBuildClient.swift
      - path: iOS/DesktopAPIClient.swift
      - path: iOS/DesktopConnectionView.swift
      - path: iOS/DesktopDiscoveryService.swift
      - path: iOS/RemoteAnnotationReviewView.swift
      - path: iOS/RemoteCommandRunnerView.swift
      - path: iOS/RemoteRoomModels.swift
      - path: iOS/RemoteRoomViewerView.swift
      - path: iOS/DocumentPickers.swift
      - path: iOS/KeychainStore.swift
      - path: iOS/YazeFileImport.swift
      - path: iOS/YazeProjectBundle.swift
      - path: iOS/YazeSecurityScope.swift
      - path: iOS/YazeProjectOpenService.swift
      - path: iOS/YazeProjectDocument.swift
      - path: iOS/YazeDocumentManager.swift
      - path: iOS/YazeConflictResolverView.swift
      - path: iOS/CloudKit/AnnotationStore.swift
      - path: iOS/CloudKit/AnnotationSyncEngine.swift
      - path: iOS/ProjectBrowserView.swift
      - path: iOS/AnnotationEditorView.swift
      - path: iOS/ProgressionDashboardView.swift
      - path: iOS/StoryGraphBrowserView.swift
      - path: iOS/OracleToolsTab.swift
      - path: Media.xcassets
      - path: iOS/LaunchScreen.storyboard
    resources:
      - path: ../../assets
    entitlements:
      path: iOS/yaze.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - "$(YAZE_ICLOUD_CONTAINER_ID)"
        com.apple.developer.icloud-container-identifiers:
          - "$(YAZE_ICLOUD_CONTAINER_ID)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: yaze
        CODE_SIGN_ENTITLEMENTS: iOS/yaze.entitlements
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    postBuildScripts:
      - name: Copy assets
        script: |
          set -e
          ASSET_SRC="${SRCROOT}/../../assets"
          ASSET_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/assets"
          if [ ! -d "${ASSET_SRC}" ]; then
            echo "Assets source missing: ${ASSET_SRC}" >&2
            exit 1
          fi
          /usr/bin/ditto "${ASSET_SRC}" "${ASSET_DST}"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Security.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreHaptics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: ModelIO.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMotion.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: GameController.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreText.framework
      - sdk: CloudKit.framework
      - sdk: PencilKit.framework
