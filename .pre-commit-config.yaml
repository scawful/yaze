# Pre-commit hooks for YAZE
# Install with: pip install pre-commit && pre-commit install

repos:
  # Clang format
  # Keep rev in sync with .clang-format-version; CI installs the same pin.
  # Formatting is scoped to src/ and test/, matching CI and the CMake targets.
  # inc/ is deliberately excluded: those public headers are not formatted yet.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        args: [--style=file, -i]
        files: ^(src|test)/.*\.(cc|cpp|h|hpp)$
        exclude: ^src/lib/

  # Clang tidy
  # Checks and header filtering come from .clang-tidy. -p needs the repo-root
  # compile database: scripts/dev/update_compile_commands.sh <preset>.
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        args: [-p, ., --quiet]
        files: ^(src|test)/.*\.(cc|cpp)$
        exclude: ^src/lib/

  # Cppcheck
  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck
        language: system
        # Quote the --enable list: an unquoted YAML flow sequence splits it on
        # commas, and cppcheck then treats "style" and "performance" as paths.
        args: ["--enable=warning,style,performance", --inconclusive, --error-exitcode=0]
        files: ^(src|test|inc)/.*\.(cc|cpp|h|hpp)$
        exclude: ^src/lib/

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # CMake formatting
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: [--config-files=cmake-format.yaml]
        files: CMakeLists\.txt$|\.cmake$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

  # Python linting (for scripts)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        files: \.py$
        exclude: ^(third_party/|build/)

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: \.py$
        exclude: ^(third_party/|build/)

