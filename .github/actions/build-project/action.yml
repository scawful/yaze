name: 'Build Project'
description: 'Build the project with CMake and caching'
inputs:
  platform:
    description: 'Target platform (linux, macos, windows)'
    required: true
  preset:
    description: 'CMake preset to use'
    required: true
  build-type:
    description: 'Build type (Debug, Release, RelWithDebInfo)'
    required: false
    default: 'RelWithDebInfo'
  targets:
    description: 'Space-separated CMake targets; empty builds the default target'
    required: false
    default: ''
  jobs:
    description: 'Maximum parallel build jobs'
    required: false
    default: '4'

runs:
  using: 'composite'
  steps:
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: build/presets/${{ inputs.preset }}
        key: build-${{ inputs.platform }}-${{ inputs.preset }}-${{ inputs.build-type }}-${{ github.sha }}
        restore-keys: |
          build-${{ inputs.platform }}-${{ inputs.preset }}-${{ inputs.build-type }}-

    - name: Configure project
      shell: bash
      run: |
        cmake --preset "${{ inputs.preset }}"

    - name: Build project (Linux/macOS)
      if: inputs.platform != 'windows'
      shell: bash
      env:
        BUILD_JOBS: ${{ inputs.jobs }}
        BUILD_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        build_args=(
          --build --preset "${{ inputs.preset }}"
          --config "${{ inputs.build-type }}"
          --parallel "$BUILD_JOBS"
        )
        if [ -n "$BUILD_TARGETS" ]; then
          read -r -a targets <<< "$BUILD_TARGETS"
          build_args+=(--target "${targets[@]}")
        fi
        echo "Using $BUILD_JOBS parallel jobs"
        cmake "${build_args[@]}"

    - name: Build project (Windows)
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        BUILD_JOBS: ${{ inputs.jobs }}
        BUILD_TARGETS: ${{ inputs.targets }}
      run: |
        $buildArgs = @(
          '--build', '--preset', '${{ inputs.preset }}',
          '--config', '${{ inputs.build-type }}',
          '--parallel', $env:BUILD_JOBS
        )
        $targets = @($env:BUILD_TARGETS -split '\s+' | Where-Object { $_ })
        if ($targets.Count -gt 0) {
          $buildArgs += '--target'
          $buildArgs += $targets
        }
        echo "Using $env:BUILD_JOBS parallel jobs"
        cmake @buildArgs

    - name: Show build artifacts
      shell: bash
      run: |
        echo "Build artifacts in build/presets/${{ inputs.preset }}:"
        find "build/presets/${{ inputs.preset }}" -name "*.exe" -o -name "yaze" -o -name "*.app" 2>/dev/null | head -10
