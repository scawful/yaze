name: 'Run Tests'
description: 'Run test suite with appropriate filtering'
inputs:
  test-type:
    description: 'Type of tests to run (stable, unit, integration, all)'
    required: true
  preset:
    description: 'CMake configure preset whose build tree contains the tests'
    required: false
    default: 'minimal'
  platform:
    description: 'Platform discriminator for artifact naming (linux, macos, windows)'
    required: false
    default: 'unknown'
  build-type:
    description: 'Multi-config build type containing the test executables'
    required: false
    default: 'RelWithDebInfo'

runs:
  using: 'composite'
  steps:
    - name: Verify test inventory
      shell: bash
      run: |
        set -euo pipefail
        build_dir="build/presets/${{ inputs.preset }}"
        label_regex="^${{ inputs.test-type }}$"
        if [ "${{ inputs.test-type }}" = "all" ]; then
          label_regex="^stable$"
        fi

        python_cmd="$(command -v python3 || command -v python || true)"
        if [ -z "$python_cmd" ]; then
          echo "Python is required to validate the CTest inventory."
          exit 1
        fi

        inventory_file="$build_dir/test_inventory.json"
        ctest --test-dir "$build_dir" \
          --build-config "${{ inputs.build-type }}" \
          --label-regex "$label_regex" \
          --show-only=json-v1 > "$inventory_file"

        test_count="$("$python_cmd" - "$inventory_file" \
          "${{ inputs.test-type }}" <<'PY'
        import json
        import os
        import sys

        with open(sys.argv[1], encoding="utf-8") as inventory:
            tests = json.load(inventory).get("tests", [])

        expected_suites = {
            "stable": {"yaze_test_unit", "yaze_test_integration"},
            "unit": {"yaze_test_unit"},
            "integration": {"yaze_test_integration"},
            "all": {"yaze_test_unit", "yaze_test_integration"},
        }[sys.argv[2]]
        suite_paths = {suite: set() for suite in expected_suites}
        for test in tests:
            command = test.get("command", [])
            if not command:
                continue
            normalized_command = command[0].replace("\\", "/")
            executable = normalized_command.rsplit("/", 1)[-1]
            if executable.lower().endswith(".exe"):
                executable = executable[:-4]
            if executable in suite_paths:
                suite_paths[executable].add(normalized_command)

        # CTest generator layouts are not uniform: multi-config generators may
        # include the configuration in the path while single-config generators
        # do not. Validate the actual selected executable instead of inferring
        # configuration from path text.
        runnable_suites = {
            suite
            for suite, paths in suite_paths.items()
            if any(os.path.isfile(path) for path in paths)
        }
        missing_suites = sorted(expected_suites - runnable_suites)
        if missing_suites:
            print(
                "CTest inventory is missing runnable required suites: "
                + ", ".join(missing_suites),
                file=sys.stderr,
            )
            for suite in missing_suites:
                candidates = sorted(suite_paths[suite])
                detail = ", ".join(candidates) if candidates else "not listed"
                print(f"- {suite}: {detail}", file=sys.stderr)
            raise SystemExit(1)
        print(len(tests))
        PY
        )"
        if [ "$test_count" -eq 0 ]; then
          echo "CTest discovered zero ${{ inputs.test-type }} tests in $build_dir for ${{ inputs.build-type }}."
          exit 1
        fi
        echo "CTest discovered $test_count ${{ inputs.test-type }} tests."

    - name: Run stable tests
      if: inputs.test-type == 'stable' || inputs.test-type == 'all'
      shell: bash
      run: |
        ctest --test-dir "build/presets/${{ inputs.preset }}" \
          --build-config "${{ inputs.build-type }}" \
          --label-regex "^stable$" \
          --no-tests=error \
          --output-on-failure \
          --timeout 300 \
          --output-junit stable_test_results.xml

    - name: Run unit tests
      if: inputs.test-type == 'unit' || inputs.test-type == 'all'
      shell: bash
      run: |
        ctest --test-dir "build/presets/${{ inputs.preset }}" \
          --build-config "${{ inputs.build-type }}" \
          --label-regex "^unit$" \
          --no-tests=error \
          --output-on-failure \
          --timeout 300 \
          --output-junit unit_test_results.xml

    - name: Run integration tests
      if: inputs.test-type == 'integration' || inputs.test-type == 'all'
      shell: bash
      run: |
        ctest --test-dir "build/presets/${{ inputs.preset }}" \
          --build-config "${{ inputs.build-type }}" \
          --label-regex "^integration$" \
          --no-tests=error \
          --output-on-failure \
          --timeout 300 \
          --output-junit integration_test_results.xml

    - name: Summarize test results
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "## Test Results (${{ inputs.platform }} / ${{ inputs.test-type }})" >> "$GITHUB_STEP_SUMMARY"
        build_dir="build/presets/${{ inputs.preset }}"
        if [ "${{ inputs.test-type }}" = "all" ]; then
          result_names=(stable unit integration)
        else
          result_names=("${{ inputs.test-type }}")
        fi

        python_cmd="$(command -v python3 || command -v python || true)"
        if [ -z "$python_cmd" ]; then
          echo "Python is required to validate JUnit results."
          exit 1
        fi

        for result_name in "${result_names[@]}"; do
          result_file="$build_dir/${result_name}_test_results.xml"
          if [ ! -s "$result_file" ]; then
            echo "Expected JUnit result is missing or empty: $result_file"
            exit 1
          fi

          read -r total failures elapsed < <("$python_cmd" - "$result_file" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        root = ET.parse(sys.argv[1]).getroot()
        suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
        total = int(root.attrib.get("tests", sum(int(s.attrib.get("tests", 0)) for s in suites)))
        failures = int(root.attrib.get("failures", sum(int(s.attrib.get("failures", 0)) for s in suites)))
        elapsed = float(root.attrib.get("time", sum(float(s.attrib.get("time", 0)) for s in suites)))
        print(total, failures, elapsed)
        PY
          )
          if [ "$total" -eq 0 ]; then
            echo "JUnit result contains zero tests: $result_file"
            exit 1
          fi
          echo "- \`$(basename "$result_file")\`: ${total} tests, ${failures} failures, ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        # Include platform in artifact name to prevent collision across matrix legs.
        name: test-results-${{ inputs.test-type }}-${{ inputs.platform }}
        path: build/presets/${{ inputs.preset }}/*test_results.xml
        if-no-files-found: ignore
        retention-days: 7
