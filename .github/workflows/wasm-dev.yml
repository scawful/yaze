name: WASM Development Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'inc/**'
      - 'cmake/**'
      - 'ext/**'
      - 'assets/**'
      - 'VERSION'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'scripts/build-wasm.sh'
      - 'scripts/package-wasm-assets.sh'
      - 'scripts/agents/package.json'
      - 'scripts/agents/package-lock.json'
      - 'scripts/agents/playwright-wasm-smoke.spec.js'
      - 'scripts/agents/serve_static_with_coi.py'
      - '.github/workflows/wasm-dev.yml'
  workflow_dispatch:

concurrency:
  group: wasm-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: '3.1.51'

jobs:
  wasm-build:
    name: "WASM Build Smoke Test"
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.27.x'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: wasm-smoke-${{ runner.os }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('CMakePresets.json', 'cmake/dependencies.lock') }}
          max-size: 1G

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ~/.cpm-cache
          key: cpm-${{ runner.os }}-wasm-${{ env.EMSDK_VERSION }}-${{ hashFiles('cmake/dependencies.lock', 'cmake/CPM.cmake', 'cmake/dependencies.cmake', 'cmake/dependencies/**/*.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-wasm-${{ env.EMSDK_VERSION }}-
            cpm-${{ runner.os }}-wasm-

      - name: Verify Emscripten setup
        run: |
          echo "=== Emscripten Configuration ==="
          emcc --version
          # emcmake has no --version flag; exercise the wrapper via cmake instead
          # (`emcmake --version` treats --version as the build command and exits 1).
          emcmake cmake --version
          echo "=== Node.js Version ==="
          node --version
          echo "=== Environment ==="
          env | grep -i em || true

      - name: Build and package WASM smoke target
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          chmod +x scripts/build-wasm.sh
          /usr/bin/time -v env \
            YAZE_WASM_BUILD_TARGETS=yaze \
            YAZE_BUILD_JOBS=4 \
            ./scripts/build-wasm.sh smoke

      - name: Verify build output
        run: |
          set -euo pipefail
          BUILD_DIR="build/presets/wasm-smoke"

          echo "=== Build Output Verification ==="
          ls -lh "$BUILD_DIR/bin/"

          test -s "$BUILD_DIR/bin/yaze.wasm"
          test -s "$BUILD_DIR/bin/yaze.js"
          test -s "$BUILD_DIR/bin/yaze.html"
          test -s "$BUILD_DIR/bin/yaze.data"
          test -s "$BUILD_DIR/dist/index.html"

          echo "=== File Sizes ==="
          du -h "$BUILD_DIR/bin/yaze.wasm"
          du -h "$BUILD_DIR/bin/yaze.js"
          du -h "$BUILD_DIR/bin/yaze.data" 2>/dev/null || echo "No .data file (lazy loading enabled?)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run browser smoke tests
        run: |
          set -euo pipefail
          cd scripts/agents
          npm ci
          npx playwright install --with-deps chromium
          python3 serve_static_with_coi.py \
            --port 8000 \
            --directory ../../build/presets/wasm-smoke/dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "WASM smoke server exited before becoming ready."
              wait "$server_pid"
              exit 1
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "WASM smoke server did not become ready within 30 seconds."
              exit 1
            fi
            sleep 1
          done
          YAZE_WASM_URL=http://127.0.0.1:8000 \
            npx playwright test playwright-wasm-smoke.spec.js --workers=1

      - name: Upload failed WASM smoke artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-smoke-${{ github.sha }}
          path: |
            build/presets/wasm-smoke/dist/
          if-no-files-found: ignore
          retention-days: 3

      - name: Build summary
        if: always()
        run: |
          BUILD_DIR="build/presets/wasm-smoke"
          {
            echo "## WASM Build Summary"
            echo ""
            echo "**Build Type:** CI smoke (Release-derived, -O1 -g0)"
            echo "**Emscripten Version:** $EMSDK_VERSION"
            echo ""

            if [ -f "$BUILD_DIR/bin/yaze.wasm" ]; then
              WASM_SIZE=$(du -h "$BUILD_DIR/bin/yaze.wasm" | cut -f1)
              echo "**WASM Size:** $WASM_SIZE"
              echo "✓ Build successful"
            else
              echo "❌ Build failed - WASM file not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
