name: Security Scanning

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  workflow_dispatch:

jobs:
  codeql:
    name: "CodeQL Analysis"
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Free up disk space
      run: |
        echo "=== Disk space before cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo docker image prune --all --force
        echo "=== Disk space after cleanup ==="
        df -h

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Setup build environment
      uses: ./.github/actions/setup-build
      with:
        platform: linux
        preset: ci-linux
        cache-key: ${{ hashFiles('cmake/dependencies.lock') }}
        # CodeQL's extractor traces real compiler calls. CMakeLists.txt enables
        # any sccache on PATH as the launcher, and a cache hit skips the
        # compiler, so the file would silently drop out of the analysis.
        compiler-cache: 'false'

    - name: Configure (no gRPC for security scan)
      run: |
        cmake --preset ci-linux -DYAZE_ENABLE_GRPC=OFF -DYAZE_ENABLE_REMOTE_AUTOMATION=OFF -DYAZE_USE_COMPILER_CACHE=OFF

    - name: Refuse to build through a compiler cache
      # ccache is installed on every Linux runner (linux-ci-packages.txt), so
      # checking PATH is not enough: CMakeLists.txt falls back to ccache when
      # sccache is absent. Check what CMake generated instead. ci-linux uses
      # Ninja Multi-Config, where compile rules live in
      # CMakeFiles/impl-<Config>.ninja rather than build.ninja, so every
      # generated .ninja file is checked, and finding none is an error.
      run: bash scripts/ci/check-no-compiler-launcher.sh build/presets/ci-linux

    - name: Build
      run: |
        cmake --build --preset ci-linux --config RelWithDebInfo --parallel $(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  dependency-scan:
    name: "Dependency Scan"
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  dependabot:
    name: "Dependabot"
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'
    
    steps:
    - name: Dependabot metadata
      run: |
        echo "Dependabot is configured via .github/dependabot.yml"
        echo "This job runs weekly to ensure dependencies are up to date"
