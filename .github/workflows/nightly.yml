name: Nightly Test Suite

on:
  # Disabled scheduled runs until test infrastructure matures
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_suites:
        description: 'Test suites to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - experimental
          - benchmarks
          - gui_e2e
          - extended_integration

env:
  BUILD_TYPE: RelWithDebInfo

defaults:
  run:
    shell: bash

jobs:
  experimental-ai-tests:
    name: "Experimental AI Tests - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_suites == 'all' ||
      github.event.inputs.test_suites == 'experimental'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        include:
          - os: ubuntu-22.04
            platform: linux
            preset: ci-linux
          - os: macos-14
            platform: macos
            preset: ci-macos
          - os: windows-2022
            platform: windows
            preset: ci-windows-ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          cache-key: ${{ hashFiles('cmake/dependencies.lock') }}

      - name: Configure with AI runtime enabled
        run: |
          cmake --preset ${{ matrix.preset }} \
            -B build_nightly \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DYAZE_ENABLE_AI_RUNTIME=ON \
            -DYAZE_ENABLE_GRPC=ON \
            -DYAZE_BUILD_AGENT_UI=ON

      - name: Build project
        run: |
          cmake --build build_nightly \
            --config ${{ env.BUILD_TYPE }} \
            --target yaze_test_experimental \
            --parallel 4

      - name: Run experimental AI tests
        run: |
          # GUI cases share the experimental label but belong to another job.
          ctest --test-dir build_nightly \
            --build-config ${{ env.BUILD_TYPE }} \
            --label-regex '^experimental$' \
            --label-exclude '^(gui|headless_gui)$' \
            --no-tests=error \
            --output-on-failure \
            --timeout 600 \
            --output-junit "$PWD/experimental_results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-test-results-${{ matrix.platform }}
          path: experimental_results.xml
          if-no-files-found: error
          retention-days: 30

  gui-e2e-tests:
    name: "GUI E2E Tests - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_suites == 'all' ||
      github.event.inputs.test_suites == 'gui_e2e'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]  # Windows GUI tests are flaky in CI
        include:
          - os: ubuntu-22.04
            platform: linux
            preset: ci-linux
          - os: macos-14
            platform: macos
            preset: ci-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          cache-key: ${{ hashFiles('cmake/dependencies.lock') }}

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dev libglu1-mesa-dev

      - name: Build project
        uses: ./.github/actions/build-project
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          build-type: ${{ env.BUILD_TYPE }}
          targets: yaze_test_gui

      - name: Run GUI E2E tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ctest --test-dir "build/presets/${{ matrix.preset }}" \
            --build-config ${{ env.BUILD_TYPE }} \
            --label-regex '^(gui|headless_gui)$' \
            --no-tests=error \
            --output-on-failure \
            --timeout 600 \
            --output-junit "$PWD/gui_e2e_results.xml"

      - name: Run GUI E2E tests (macOS)
        if: runner.os == 'macOS'
        run: |
          ctest --test-dir "build/presets/${{ matrix.preset }}" \
            --build-config ${{ env.BUILD_TYPE }} \
            --label-regex '^(gui|headless_gui)$' \
            --no-tests=error \
            --output-on-failure \
            --timeout 600 \
            --output-junit "$PWD/gui_e2e_results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-e2e-results-${{ matrix.platform }}
          path: gui_e2e_results.xml
          if-no-files-found: error
          retention-days: 30

  benchmark-tests:
    name: "Performance Benchmarks"
    runs-on: ubuntu-22.04
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_suites == 'all' ||
      github.event.inputs.test_suites == 'benchmarks'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          platform: linux
          preset: ci-linux
          cache-key: ${{ hashFiles('cmake/dependencies.lock') }}

      - name: Build benchmarks
        run: |
          cmake --preset ci-linux \
            -B build_bench \
            -DCMAKE_BUILD_TYPE=Release \
            -DYAZE_BUILD_TESTS=ON
          cmake --build build_bench \
            --config Release \
            --target yaze_test_benchmark \
            --parallel 4

      - name: Run benchmarks
        run: |
          # This target contains GoogleTest benchmarks, not Google Benchmark.
          ctest --test-dir build_bench \
            --build-config Release \
            --label-regex '^benchmark$' \
            --no-tests=error \
            --output-on-failure \
            --timeout 600 \
            --output-junit "$PWD/benchmark_results.xml"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.xml
          if-no-files-found: error
          retention-days: 90

  extended-integration-tests:
    name: "Extended Integration Tests"
    runs-on: ubuntu-22.04
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_suites == 'all' ||
      github.event.inputs.test_suites == 'extended_integration'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          platform: linux
          preset: ci-linux
          cache-key: ${{ hashFiles('cmake/dependencies.lock') }}

      - name: Build with full features
        run: |
          cmake --preset ci-linux \
            -B build_extended \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DYAZE_ENABLE_GRPC=ON \
            -DYAZE_ENABLE_JSON=ON \
            -DYAZE_ENABLE_HTTP_API=ON \
            -DYAZE_BUILD_AGENT_UI=ON
          cmake --build build_extended \
            --config ${{ env.BUILD_TYPE }} \
            --target yaze_test_integration \
            --parallel 4

      - name: Run extended integration tests
        run: |
          ctest --test-dir build_extended \
            --build-config ${{ env.BUILD_TYPE }} \
            --label-regex '^integration$' \
            --no-tests=error \
            --output-on-failure \
            --timeout 1200 \
            --output-junit "$PWD/extended_integration_results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-integration-results
          path: extended_integration_results.xml
          if-no-files-found: error
          retention-days: 30

  nightly-summary:
    name: "Nightly Test Summary"
    runs-on: ubuntu-latest
    if: always()
    needs: [
      experimental-ai-tests,
      gui-e2e-tests,
      benchmark-tests,
      extended-integration-tests
    ]

    steps:
      - name: Generate summary
        env:
          NIGHTLY_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(os.environ["NIGHTLY_RESULTS_JSON"])
          names = {
              "experimental-ai-tests": "Experimental AI Tests",
              "gui-e2e-tests": "GUI E2E Tests",
              "benchmark-tests": "Performance Benchmarks",
              "extended-integration-tests": "Extended Integration Tests",
          }
          labels = {"success": "Passed", "skipped": "Skipped"}
          lines = ["# Nightly Test Results", ""]
          for job, name in names.items():
              result = results[job]["result"]
              lines.append(f"- **{name}:** {labels.get(result, result.title())}")
          lines += ["", "See each suite's JUnit artifact for failures and skips."]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
