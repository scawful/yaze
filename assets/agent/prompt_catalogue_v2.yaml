# Prompt Catalogue V2 - Simplified for testing
# This version focuses on clear tool calling workflow

commands:
  palette export: |-
    Export palette data to JSON file
      --group <group>  Palette group (overworld, dungeon, sprite)
      --id <id>        Palette ID (0-based index)
      --to <file>      Output JSON file path
  overworld set-tile: |-
    Place a tile in the overworld
      --map <id>       Map ID (0-based)
      --x <x>          X coordinate (0-63)
      --y <y>          Y coordinate (0-63)
      --tile <hex>     Tile ID in hex (e.g., 0x02E for tree)
  rom validate: "Validate ROM integrity and structure"

tools:
  - name: resource-list
    description: "List all labeled resources of a specific type"
    usage_notes: "Valid categories: room, entrance, sprite, overlord, item"
    arguments:
      - name: type
        description: "Resource category"
        required: true
        example: room
      - name: format
        description: "Response format (json or table)"
        required: false
        example: json
  - name: dungeon-edit-inspect
    description: "Inspect current unsaved room objects in the loaded native Yaze editor."
    usage_notes: "Available only inside the running native Yaze app with the room already loaded. Call dungeon-edit-inspect immediately before dungeon-edit-apply; copy its session_id and complete six-field integer object guards in original index order. These tools never save the ROM and have no CLI fallback."
    arguments:
      - name: room
        description: "Numeric room ID in decimal or hexadecimal (for example 37 or 0x25); this room must already be loaded in the active native editor session."
        required: true
        example: "0x25"
  - name: dungeon-edit-apply
    description: "Apply a guarded room-object move batch in the loaded native Yaze editor as one Undo action."
    usage_notes: "First inspect the same room with dungeon-edit-inspect. Copy the exact session_id and every expected_objects guard (object_index, object_id, x_tile, y_tile, size, stored_list) without changing their values or order. Pass batch as a JSON-encoded string containing exactly session_id, expected_objects and moves. Each move contains object_index, x_tile and y_tile as JSON integers; destination coordinates must be 0..63 and the full rendered footprint must fit the room. Invalid or stale batches reject atomically. Accepted edits render in the native canvas and normal Undo restores the whole batch. This requires the connected native editor host and mutating-tool authorization; it never saves the ROM and has no CLI fallback."
    arguments:
      - name: room
        description: "Numeric room ID in decimal or hexadecimal (for example 37 or 0x25); this room must already be loaded in the active native editor session."
        required: true
        example: "0x25"
      - name: batch
        description: "JSON-encoded string with exactly session_id, complete expected_objects from the latest inspect response, and moves. Every guard field is an integer. Each move is {object_index: integer, x_tile: integer 0..63, y_tile: integer 0..63}; use JSON object syntax with quoted field names."
        required: true
  - name: dungeon-get-palette
    description: "Read-only resolution of a US/OOS room's full 8-bit palette-set ID to its shared global dungeon palette."
    usage_notes: "Returns the resolved palette index, raw 15-bit colors, addresses, and every affected room without mutating the ROM; unsupported regional layouts fail closed."
    arguments:
      - name: room
        description: "Dungeon room ID in hex."
        required: true
        example: 0xA8
      - name: index
        description: "Optional color index from 0 through 89."
        required: false
        example: 7
  - name: dungeon-set-palette-color
    description: "Guarded mutating tool for dry-running or persisting one US/OOS shared dungeon palette color."
    usage_notes: "Dry-run by default. Copy expected values from a fresh getter, review affected rooms, and request write only for a clean disposable file-backed ROM with a Hack Manifest."
    arguments:
      - name: room
        description: "Dungeon room ID in hex."
        required: true
        example: 0xA8
      - name: index
        description: "Color index from 0 through 89."
        required: true
        example: 7
      - name: expect-palette-set
        description: "Expected full 8-bit room-header palette-set ID."
        required: true
        example: 0x07
      - name: expect-palette-index
        description: "Expected resolved global dungeon palette index from 0 through 19."
        required: true
        example: 7
      - name: expect-color
        description: "Expected current raw 15-bit SNES color word."
        required: true
        example: 0x7FFF
      - name: color
        description: "Replacement raw 15-bit SNES color word."
        required: true
        example: 0x7FFE
      - name: manifest
        description: "Hack Manifest path used to block protected write ranges."
        required: true
        example: Roms/hack_manifest.json
      - name: write
        description: "Optional boolean. True requests the guarded persistent write; false or omitted previews only."
        required: false
        example: "false"

tile16_reference:
  grass: 0x020
  tree: 0x02E
  water: 0x14C

examples:
  - user_prompt: "What rooms are in this ROM?"
    reasoning: "User wants room list. Call resource-list tool first."
    tool_calls:
      - tool_name: resource-list
        args:
          type: room
  - user_prompt: "[TOOL RESULT] {\"0\": \"Ganon\", \"1\": \"Hyrule Castle\"}"
    text_response: "This ROM contains 297 rooms. The first two are: Ganon (ID 0) and Hyrule Castle (ID 1)."
    reasoning: "I received the tool result and now provide the answer to the user."
